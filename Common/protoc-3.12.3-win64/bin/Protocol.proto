message ItemStat{
    float AttackDamage = 1;                  //공격력
    float AttackSpeed = 2;                   //공격속도
    float CriticalRatio = 3;                 //치명타 확률
    float CriticalDamage = 4;                //치명타 피해량
    float AttackRange = 5;                   //기본 공격 사거리
    float FixedSkillAmplification = 6;       //고정 스킬 증폭
    float PercentageSkillAmplification = 7;  //퍼센트 스킬 증폭
